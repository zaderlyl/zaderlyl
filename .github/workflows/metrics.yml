name: Metrics (calendrier isométrique des commits)

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 3h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          user: ${{ github.repository_owner }}
          filename: assets/metrics.svg
          committer_message: "chore: mise à jour du calendrier isométrique"

          base: ""
          config_timezone: Europe/Paris
          config_base_color: "#ff9100"

          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year
