<meta charset="utf-8">
<title>Spoti-Stat</title>
<meta name="description" content="stats d'ecoute Spotify">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --void:#0a0b0d;
    --surface:#14161b;
    --surface-2:#1c1f26;
    --line:#2a2e37;
    --fog:#7b8394;
    --paper:#eef0f4;
    --paper-dim:#aeb3bf;
    --accent:#199e70;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--void);color:var(--paper);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:
      radial-gradient(circle at 20% 20%, #ffffff0a 0, transparent 1px) 0 0/34px 34px,
      radial-gradient(circle at 60% 70%, #ffffff08 0, transparent 1px) 0 0/54px 54px;
    pointer-events:none;
  }
  .win{
    position:relative;
    width:min(880px,94vw);
    height:min(560px,84vh);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 40px 100px -20px #000000b3, 0 0 0 1px #ffffff08 inset;
  }
  .titlebar{
    height:42px;flex:none;
    display:flex;align-items:center;gap:10px;
    padding:0 14px;
    background:var(--surface-2);
    border-bottom:1px solid var(--line);
  }
  .dots{display:flex;gap:6px;}
  .dots span{width:9px;height:9px;border-radius:50%;display:block;}
  .dots span:nth-child(1){background:#e6675f;}
  .dots span:nth-child(2){background:#e6b95f;}
  .dots span:nth-child(3){background:#5fbf6e;}
  .titletext{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--paper-dim);
    margin-left:2px;
  }
  .titletext b{color:var(--paper);font-weight:600;}
  .stage{position:relative;flex:1;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  .stripe{
    flex:none;
    display:flex;align-items:stretch;
    border-top:1px solid var(--line);
    background:var(--surface-2);
  }
  .stat{
    flex:1;padding:9px 12px;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:1px;
    justify-content:center;
  }
  .stat:last-child{border-right:none;}
  .stat .n{
    font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;
    font-size:15px;font-weight:700;line-height:1.1;color:var(--paper);
    white-space:nowrap;
  }
  .stat .l{
    font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--fog);
    margin-top:2px;white-space:nowrap;
  }
  .stat.add .n{color:#4fbf8a;}
  .stat.del .n{color:#199e70;}

  .tooltip{
    position:absolute;pointer-events:none;
    transform:translate(-50%,calc(-100% - 12px));
    background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;
    font-size:11.5px;max-width:220px;
    box-shadow:0 8px 20px #00000066;
    z-index:5;
  }
  .tooltip .msg{color:var(--paper);font-weight:600;margin-bottom:2px;font-size:11.5px;line-height:1.3;}
  .tooltip .meta{color:var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:10.5px;}

  .hint{
    position:absolute;left:10px;bottom:10px;
    font-size:10px;color:var(--fog);
    font-family:'JetBrains Mono',monospace;
    pointer-events:none;
  }
</style>

<div class="win">
  <div class="titlebar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="titletext"><b>Spoti-Stat</b> — stats d'ecoute Spotify</div>
  </div>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="tooltip" id="tooltip" hidden></div>
    <div class="hint">glisser: pivoter · molette: zoom · clic: ouvrir le commit</div>
  </div>
  <div class="stripe" id="stripe"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
  "use strict";
  var DATA = {"repo":"zaderlyl/Spoti-Stat","branchColor":{"main":"#199e70"},"commits":[{"sha":"43e3964","t":1779886796000,"day":"2026-05-27","author":"lilian","msg":"Initial commit","branch":"main","parents":[],"add":11,"del":0},{"sha":"cf02cde","t":1779888157000,"day":"2026-05-27","author":"Lilian CORNET","msg":"bootstrap instaling","branch":"main","parents":["43e3964"],"add":12,"del":8},{"sha":"2329520","t":1780053386000,"day":"2026-05-29","author":"Lilian CORNET","msg":"structur site","branch":"main","parents":["cf02cde"],"add":105,"del":13},{"sha":"1fb8ef6","t":1780120178000,"day":"2026-05-30","author":"Lilian CORNET","msg":"add JSON BDD","branch":"main","parents":["2329520"],"add":18229,"del":0},{"sha":"1b7e4e3","t":1780120200000,"day":"2026-05-30","author":"Lilian CORNET","msg":"external style to bootstrap","branch":"main","parents":["1fb8ef6"],"add":8,"del":0},{"sha":"de76153","t":1780120578000,"day":"2026-05-30","author":"Lilian CORNET","msg":"write html with chart","branch":"main","parents":["1b7e4e3"],"add":37,"del":37},{"sha":"d49e277","t":1780120608000,"day":"2026-05-30","author":"Lilian CORNET","msg":"add alpine script","branch":"main","parents":["de76153"],"add":84,"del":0},{"sha":"8d87c3b","t":1780121370000,"day":"2026-05-30","author":"Lilian CORNET","msg":"rename my data space","branch":"main","parents":["d49e277"],"add":0,"del":0},{"sha":"1a58afc","t":1780220281000,"day":"2026-05-31","author":"Lilian CORNET","msg":"new version for graph chart","branch":"main","parents":["8d87c3b"],"add":229,"del":61},{"sha":"213482c","t":1780910318000,"day":"2026-06-08","author":"Lilian CORNET","msg":"Update settings.json","branch":"main","parents":["1a58afc"],"add":1,"del":1},{"sha":"e477fc9","t":1780933037000,"day":"2026-06-08","author":"Lilian CORNET","msg":"personal data update","branch":"main","parents":["213482c"],"add":80303,"del":14053},{"sha":"2ea6edb","t":1780933551000,"day":"2026-06-08","author":"Lilian CORNET","msg":"add information pop-up","branch":"main","parents":["e477fc9"],"add":179,"del":12},{"sha":"20c403d","t":1780934614000,"day":"2026-06-08","author":"Lilian CORNET","msg":"add album list and the final task for perfect code :)","branch":"main","parents":["2ea6edb"],"add":92,"del":134},{"sha":"8218f4b","t":1780940159000,"day":"2026-06-08","author":"Lilian CORNET","msg":"final touch","branch":"main","parents":["20c403d"],"add":97,"del":118},{"sha":"886bc13","t":1781098663000,"day":"2026-06-10","author":"Lilian CORNET","msg":"final commit + add and fusion json for add's music to top","branch":"main","parents":["8218f4b"],"add":90375,"del":26},{"sha":"d03e829","t":1781101508000,"day":"2026-06-10","author":"Lilian CORNET","msg":"add last.fm for have in reel time the spotify music listen","branch":"main","parents":["886bc13"],"add":3973,"del":0},{"sha":"bbb57a7","t":1781104137000,"day":"2026-06-10","author":"Lilian CORNET","msg":"tiny update","branch":"main","parents":["d03e829"],"add":379,"del":93},{"sha":"a05079c","t":1781158407000,"day":"2026-06-11","author":"Lilian CORNET","msg":"new update for V2","branch":"main","parents":["bbb57a7"],"add":14723,"del":362},{"sha":"bf85304","t":1781161423000,"day":"2026-06-11","author":"Lilian CORNET","msg":"new update","branch":"main","parents":["a05079c"],"add":4486,"del":0},{"sha":"34107ba","t":1781163826000,"day":"2026-06-11","author":"Lilian CORNET","msg":"rename","branch":"main","parents":["bf85304"],"add":1,"del":1},{"sha":"501f537","t":1781169790000,"day":"2026-06-11","author":"Lilian CORNET","msg":"add album systeme","branch":"main","parents":["34107ba"],"add":123,"del":63},{"sha":"99fbce7","t":1781170282000,"day":"2026-06-11","author":"Lilian CORNET","msg":"album systeme v2","branch":"main","parents":["501f537"],"add":134,"del":10},{"sha":"24b509c","t":1781170819000,"day":"2026-06-11","author":"Lilian CORNET","msg":"bétise","branch":"main","parents":["99fbce7"],"add":0,"del":0},{"sha":"077aeb4","t":1781171513000,"day":"2026-06-11","author":"Lilian CORNET","msg":"possibility to retract a category","branch":"main","parents":["24b509c"],"add":113,"del":72},{"sha":"28720b5","t":1781172181000,"day":"2026-06-11","author":"Lilian CORNET","msg":"parts 2","branch":"main","parents":["077aeb4"],"add":79,"del":40},{"sha":"a2ef77c","t":1781172645000,"day":"2026-06-11","author":"Lilian CORNET","msg":"Update scriptV2.js","branch":"main","parents":["28720b5"],"add":10,"del":9},{"sha":"6c4e48e","t":1781177220000,"day":"2026-06-11","author":"Lilian CORNET","msg":"Title : )","branch":"main","parents":["a2ef77c"],"add":41,"del":21},{"sha":"891de32","t":1781349225000,"day":"2026-06-13","author":"Lilian CORNET","msg":"add music n'd design modification","branch":"main","parents":["6c4e48e"],"add":29330,"del":10429},{"sha":"a77b027","t":1781368627000,"day":"2026-06-13","author":"Lilian CORNET","msg":"add music","branch":"main","parents":["891de32"],"add":103,"del":0},{"sha":"6ba5e77","t":1781370255000,"day":"2026-06-13","author":"Lilian CORNET","msg":"add featuring with artist pin","branch":"main","parents":["a77b027"],"add":23,"del":1},{"sha":"7de3dc3","t":1781372014000,"day":"2026-06-13","author":"Lilian CORNET","msg":"test","branch":"main","parents":["6ba5e77"],"add":136,"del":54},{"sha":"4a49836","t":1781441917000,"day":"2026-06-14","author":"Lilian CORNET","msg":"add new music","branch":"main","parents":["7de3dc3"],"add":17696,"del":0},{"sha":"9d60b01","t":1781447479000,"day":"2026-06-14","author":"Lilian CORNET","msg":"proxy vercel","branch":"main","parents":["4a49836"],"add":809,"del":8},{"sha":"5b1c72e","t":1781454215000,"day":"2026-06-14","author":"Lilian CORNET","msg":"add music","branch":"main","parents":["9d60b01"],"add":3909,"del":0},{"sha":"0d01cff","t":1781465570000,"day":"2026-06-14","author":"Lilian CORNET","msg":"add music","branch":"main","parents":["5b1c72e"],"add":7753,"del":0},{"sha":"e2fdaa5","t":1781512193000,"day":"2026-06-15","author":"Lilian CORNET","msg":"new music","branch":"main","parents":["0d01cff"],"add":11124,"del":0},{"sha":"ab214fb","t":1781531534000,"day":"2026-06-15","author":"Lilian CORNET","msg":"add+music","branch":"main","parents":["e2fdaa5"],"add":854,"del":0},{"sha":"dcce487","t":1781533639000,"day":"2026-06-15","author":"Lilian CORNET","msg":"correction problematique IP et proxy","branch":"main","parents":["ab214fb"],"add":186,"del":5}]}
;
  var ACCENT = "#199e70";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var commits = DATA.commits;
  var days = [], dayIndex = {};
  commits.forEach(function(c){
    if (!(c.day in dayIndex)) { dayIndex[c.day] = days.length; days.push(c.day); }
  });
  var byDay = days.map(function(d){ return commits.filter(function(c){return c.day===d;}); });
  var maxDayCount = Math.max.apply(null, byDay.map(function(a){return a.length;}));

  var totalAdd=0, totalDel=0;
  commits.forEach(function(c){ totalAdd+=c.add; totalDel+=c.del; });
  function fmt(n){ return n.toLocaleString('fr-FR'); }
  function fmtDay(d){ return d.slice(8,10)+'/'+d.slice(5,7); }

  var stripe = document.getElementById('stripe');
  var period = days.length>1 ? (fmtDay(days[0])+'\u2013'+fmtDay(days[days.length-1])) : fmtDay(days[0]);
  [
    {n: commits.length, l:'Commits'},
    {n: days.length, l: days.length>1?'Jours actifs':'Jour'},
    {n: period, l:'P\u00e9riode'},
    {n:'+'+fmt(totalAdd), l:'Ajout\u00e9es', cls:'add'},
    {n:'\u2212'+fmt(totalDel), l:'Supprim\u00e9es', cls:'del'}
  ].forEach(function(s){
    var d = document.createElement('div');
    d.className = 'stat' + (s.cls?(' '+s.cls):'');
    d.innerHTML = '<span class="n">'+s.n+'</span><span class="l">'+s.l+'</span>';
    stripe.appendChild(d);
  });

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  var VOID = 0x0a0b0d;
  renderer.setClearColor(VOID, 1);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(VOID, 0.02);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0x3a4258, 0x08090b, 0.75));
  var dir = new THREE.DirectionalLight(0xeef0f4, 0.95);
  dir.position.set(14,20,11); scene.add(dir);
  scene.add(new THREE.AmbientLight(0x8891a3, 0.25));

  var PITCH = 13, SLOT_W = 9.5;
  function dayX(i){ return (i - (days.length-1)/2) * PITCH; }

  var sceneWidth = PITCH * Math.max(1, days.length-1) + 10;
  var gridSize = Math.min(150, Math.max(44, sceneWidth + 24));
  var grid = new THREE.GridHelper(gridSize, Math.round(gridSize/4), 0x2a2e37, 0x1c1f26);
  scene.add(grid);

  var grayMin = new THREE.Color(0x1c1f26), grayMax = new THREE.Color(0x7b8394);
  var barHeights = [];
  var dayGroup = new THREE.Group();
  byDay.forEach(function(list, i){
    var h = 0.5 + list.length * 0.3;
    barHeights.push(h);
    var geo = new THREE.BoxGeometry(SLOT_W, h, 8);
    var t = list.length / maxDayCount;
    var col = grayMin.clone().lerp(grayMax, 0.15 + t*0.55);
    var mat = new THREE.MeshStandardMaterial({ color: col, roughness:0.95, metalness:0.02 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(dayX(i), h/2, 0);
    dayGroup.add(mesh);
  });
  scene.add(dayGroup);

  var positions = {}, nodeMeshes = [], edgeLines = [];
  var nodeGroup = new THREE.Group(), edgeGroup = new THREE.Group();
  var accentColor = new THREE.Color(ACCENT);

  byDay.forEach(function(list, i){
    var dMin = Math.min.apply(null, list.map(function(c){return c.t;}));
    var dMax = Math.max.apply(null, list.map(function(c){return c.t;}));
    list.forEach(function(c){
      var frac = dMax > dMin ? (c.t-dMin)/(dMax-dMin) : 0.5;
      var x = dayX(i) + (frac-0.5)*SLOT_W*0.72;
      var z = 0;
      var mag = Math.log2(1 + c.add + c.del);
      var y = barHeights[i] + 0.5 + Math.min(2.6, mag*0.3);
      var r = 0.13 + Math.min(0.22, mag*0.03);
      positions[c.sha] = new THREE.Vector3(x,y,z);
      var geo = new THREE.SphereGeometry(r, 14, 14);
      var mat = new THREE.MeshStandardMaterial({
        color: accentColor, emissive: accentColor, emissiveIntensity:0.42,
        roughness:0.35, metalness:0.15
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(positions[c.sha]);
      mesh.userData = { commit: c, baseEmissive:0.42 };
      nodeGroup.add(mesh); nodeMeshes.push(mesh);
    });
  });
  commits.forEach(function(c){
    var to = positions[c.sha];
    (c.parents||[]).forEach(function(p){
      var from = positions[p];
      if (!from) return;
      var mid = from.clone().lerp(to,0.5);
      mid.y += 0.5 + from.distanceTo(to)*0.05;
      var curve = new THREE.QuadraticBezierCurve3(from, mid, to);
      var geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(14));
      var mat = new THREE.LineBasicMaterial({ color: accentColor, transparent:true, opacity:0.5 });
      var line = new THREE.Line(geo, mat);
      edgeGroup.add(line); edgeLines.push(line);
    });
  });
  scene.add(nodeGroup); scene.add(edgeGroup);

  var target = new THREE.Vector3(0, Math.max(2, barHeights.reduce((a,b)=>a+b,0)/barHeights.length*0.6), 0);
  var defaultPhi = days.length > 6 ? 0.82 : 1.02;
  var camState = { theta: 0.65, phi: defaultPhi, radius: Math.min(78, Math.max(22, sceneWidth*0.58)), autoRotate: !reduceMotion };
  var MIN_R = 10, MAX_R = 80, MIN_PHI=0.32, MAX_PHI=1.48;

  function updateCamera(){
    var s = camState;
    camera.position.set(
      target.x + s.radius*Math.sin(s.phi)*Math.sin(s.theta),
      target.y + s.radius*Math.cos(s.phi),
      target.z + s.radius*Math.sin(s.phi)*Math.cos(s.theta)
    );
    camera.lookAt(target);
  }

  var dragging=false, lastX=0, lastY=0, moved=0, idleTimer=null;
  var pointers = {};
  var userAutoRotate = !reduceMotion;
  function wake(){
    if (idleTimer) clearTimeout(idleTimer);
    if (userAutoRotate && !reduceMotion) idleTimer = setTimeout(function(){ camState.autoRotate=true; }, 3800);
  }

  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    if (Object.keys(pointers).length===1){
      dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
      canvas.classList.add('dragging');
      camState.autoRotate=false;
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if (pointers[e.pointerId]) pointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    var ids = Object.keys(pointers);
    if (ids.length===2){
      var p = ids.map(function(id){return pointers[id];});
      var dist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if (canvas._pinch){
        camState.radius = Math.min(MAX_R, Math.max(MIN_R, camState.radius + (canvas._pinch-dist)*0.05));
      }
      canvas._pinch = dist; return;
    }
    if (!dragging){ handleHover(e); return; }
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    camState.theta -= dx*0.0065;
    camState.phi = Math.min(MAX_PHI, Math.max(MIN_PHI, camState.phi - dy*0.0065));
    hideTooltip();
  });
  function endDrag(e){
    delete pointers[e.pointerId]; canvas._pinch=null;
    if (Object.keys(pointers).length===0){
      dragging=false; canvas.classList.remove('dragging');
      if (moved<5) handleClick(e);
      wake();
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    camState.radius = Math.min(MAX_R, Math.max(MIN_R, camState.radius + e.deltaY*0.02));
  }, { passive:false });

  var raycaster = new THREE.Raycaster();
  var mouseNdc = new THREE.Vector2();
  var tooltipEl = document.getElementById('tooltip');
  var hovered = null;

  function handleHover(e){
    var rect = canvas.getBoundingClientRect();
    mouseNdc.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouseNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouseNdc, camera);
    var hits = raycaster.intersectObjects(nodeMeshes);
    if (hits.length){
      var m = hits[0].object;
      if (hovered!==m){ if(hovered) setHover(hovered,false); hovered=m; setHover(m,true); }
      showTooltip(e.clientX-rect.left, e.clientY-rect.top, m.userData.commit);
      canvas.style.cursor='pointer';
    } else {
      if (hovered){ setHover(hovered,false); hovered=null; }
      hideTooltip();
      canvas.style.cursor = dragging?'grabbing':'grab';
    }
  }
  function setHover(m,on){
    m.material.emissiveIntensity = on?0.9:m.userData.baseEmissive;
    m.scale.setScalar(on?1.6:1);
  }
  function showTooltip(x,y,c){
    tooltipEl.hidden=false;
    tooltipEl.style.left=x+'px'; tooltipEl.style.top=y+'px';
    tooltipEl.innerHTML = '<div class="msg">'+escapeHtml(c.msg)+'</div><div class="meta">'+fmtDate(c.t)+'</div>';
  }
  function hideTooltip(){ tooltipEl.hidden=true; }
  function handleClick(e){
    var rect = canvas.getBoundingClientRect();
    mouseNdc.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouseNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouseNdc, camera);
    var hits = raycaster.intersectObjects(nodeMeshes);
    if (!hits.length) return;
    var c = hits[0].object.userData.commit;
    window.open('https://github.com/'+DATA.repo+'/commit/'+c.sha, '_blank', 'noopener');
  }
  function fmtDate(t){
    var d = new Date(t);
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' \u00b7 '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  function escapeHtml(s){
    return s.replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; });
  }

  function resize(){
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var clock = new THREE.Clock();
  function tick(){
    var dt = clock.getDelta();
    if (camState.autoRotate) camState.theta += dt*0.06;
    updateCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
