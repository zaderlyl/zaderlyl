<meta charset="utf-8">
<title>Note-2-</title>
<meta name="description" content="notes partagees, Firebase">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --void:#0a0b0d;
    --surface:#14161b;
    --surface-2:#1c1f26;
    --line:#2a2e37;
    --fog:#7b8394;
    --paper:#eef0f4;
    --paper-dim:#aeb3bf;
    --accent:#7b8394;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;background:var(--void);color:var(--paper);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    display:flex;align-items:center;justify-content:center;
    overflow:hidden;
  }
  body::before{
    content:"";position:fixed;inset:0;
    background:
      radial-gradient(circle at 20% 20%, #ffffff0a 0, transparent 1px) 0 0/34px 34px,
      radial-gradient(circle at 60% 70%, #ffffff08 0, transparent 1px) 0 0/54px 54px;
    pointer-events:none;
  }
  .win{
    position:relative;
    width:min(880px,94vw);
    height:min(560px,84vh);
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:14px;
    overflow:hidden;
    display:flex;flex-direction:column;
    box-shadow:0 40px 100px -20px #000000b3, 0 0 0 1px #ffffff08 inset;
  }
  .titlebar{
    height:42px;flex:none;
    display:flex;align-items:center;gap:10px;
    padding:0 14px;
    background:var(--surface-2);
    border-bottom:1px solid var(--line);
  }
  .dots{display:flex;gap:6px;}
  .dots span{width:9px;height:9px;border-radius:50%;display:block;}
  .dots span:nth-child(1){background:#e6675f;}
  .dots span:nth-child(2){background:#e6b95f;}
  .dots span:nth-child(3){background:#5fbf6e;}
  .titletext{
    font-family:'JetBrains Mono',monospace;
    font-size:12px;color:var(--paper-dim);
    margin-left:2px;
  }
  .titletext b{color:var(--paper);font-weight:600;}
  .stage{position:relative;flex:1;min-height:0;}
  canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none;cursor:grab;}
  canvas.dragging{cursor:grabbing;}

  .stripe{
    flex:none;
    display:flex;align-items:stretch;
    border-top:1px solid var(--line);
    background:var(--surface-2);
  }
  .stat{
    flex:1;padding:9px 12px;
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;gap:1px;
    justify-content:center;
  }
  .stat:last-child{border-right:none;}
  .stat .n{
    font-family:'JetBrains Mono',monospace;font-variant-numeric:tabular-nums;
    font-size:15px;font-weight:700;line-height:1.1;color:var(--paper);
    white-space:nowrap;
  }
  .stat .l{
    font-size:9px;letter-spacing:.05em;text-transform:uppercase;color:var(--fog);
    margin-top:2px;white-space:nowrap;
  }
  .stat.add .n{color:#4fbf8a;}
  .stat.del .n{color:#7b8394;}

  .tooltip{
    position:absolute;pointer-events:none;
    transform:translate(-50%,calc(-100% - 12px));
    background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:7px 9px;
    font-size:11.5px;max-width:220px;
    box-shadow:0 8px 20px #00000066;
    z-index:5;
  }
  .tooltip .msg{color:var(--paper);font-weight:600;margin-bottom:2px;font-size:11.5px;line-height:1.3;}
  .tooltip .meta{color:var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:10.5px;}

  .hint{
    position:absolute;left:10px;bottom:10px;
    font-size:10px;color:var(--fog);
    font-family:'JetBrains Mono',monospace;
    pointer-events:none;
  }
</style>

<div class="win">
  <div class="titlebar">
    <div class="dots"><span></span><span></span><span></span></div>
    <div class="titletext"><b>Note-2-</b> — notes partagees, Firebase</div>
  </div>
  <div class="stage" id="stage">
    <canvas id="gl"></canvas>
    <div class="tooltip" id="tooltip" hidden></div>
    <div class="hint">glisser: pivoter · molette: zoom · clic: ouvrir le commit</div>
  </div>
  <div class="stripe" id="stripe"></div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/0.160.0/three.min.js"></script>
<script>
(function(){
  "use strict";
  var DATA = {"repo":"zaderlyl/Note-2-","branchColor":{"main":"#7b8394"},"commits":[{"sha":"7fcbd45","t":1787127235000,"day":"2026-08-19","author":"Lilian CORNET","msg":"Initial commit","branch":"main","parents":[],"add":1,"del":0},{"sha":"f177907","t":1787127470000,"day":"2026-08-19","author":"Lilian CORNET","msg":"Import Notes(2): page partagée CRDT, photos, vocal, widget","branch":"main","parents":["7fcbd45"],"add":4705,"del":0},{"sha":"4611a92","t":1787129886000,"day":"2026-08-19","author":"Lilian CORNET","msg":"Bascule vers Firebase : hub multi-notes, comptes, partage par e-mail","branch":"main","parents":["f177907"],"add":1784,"del":843},{"sha":"24ab146","t":1787167910000,"day":"2026-08-19","author":"Lilian CORNET","msg":"Firebase opérationnel de bout en bout : auth Google, hub, sync temps réel","branch":"main","parents":["4611a92"],"add":114,"del":27},{"sha":"800f3ab","t":1787169003000,"day":"2026-08-19","author":"Lilian CORNET","msg":"Corrige la latence à la frappe : fusionne les segments de texte contigus","branch":"main","parents":["24ab146"],"add":55,"del":5}]}
;
  var ACCENT = "#7b8394";
  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  var commits = DATA.commits;
  var days = [], dayIndex = {};
  commits.forEach(function(c){
    if (!(c.day in dayIndex)) { dayIndex[c.day] = days.length; days.push(c.day); }
  });
  var byDay = days.map(function(d){ return commits.filter(function(c){return c.day===d;}); });
  var maxDayCount = Math.max.apply(null, byDay.map(function(a){return a.length;}));

  var totalAdd=0, totalDel=0;
  commits.forEach(function(c){ totalAdd+=c.add; totalDel+=c.del; });
  function fmt(n){ return n.toLocaleString('fr-FR'); }
  function fmtDay(d){ return d.slice(8,10)+'/'+d.slice(5,7); }

  var stripe = document.getElementById('stripe');
  var period = days.length>1 ? (fmtDay(days[0])+'\u2013'+fmtDay(days[days.length-1])) : fmtDay(days[0]);
  [
    {n: commits.length, l:'Commits'},
    {n: days.length, l: days.length>1?'Jours actifs':'Jour'},
    {n: period, l:'P\u00e9riode'},
    {n:'+'+fmt(totalAdd), l:'Ajout\u00e9es', cls:'add'},
    {n:'\u2212'+fmt(totalDel), l:'Supprim\u00e9es', cls:'del'}
  ].forEach(function(s){
    var d = document.createElement('div');
    d.className = 'stat' + (s.cls?(' '+s.cls):'');
    d.innerHTML = '<span class="n">'+s.n+'</span><span class="l">'+s.l+'</span>';
    stripe.appendChild(d);
  });

  var stage = document.getElementById('stage');
  var canvas = document.getElementById('gl');
  var renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias:true, alpha:false, preserveDrawingBuffer:true });
  renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  var VOID = 0x0a0b0d;
  renderer.setClearColor(VOID, 1);

  var scene = new THREE.Scene();
  scene.fog = new THREE.FogExp2(VOID, 0.02);
  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 300);

  scene.add(new THREE.HemisphereLight(0x3a4258, 0x08090b, 0.75));
  var dir = new THREE.DirectionalLight(0xeef0f4, 0.95);
  dir.position.set(14,20,11); scene.add(dir);
  scene.add(new THREE.AmbientLight(0x8891a3, 0.25));

  var PITCH = 13, SLOT_W = 9.5;
  function dayX(i){ return (i - (days.length-1)/2) * PITCH; }

  var sceneWidth = PITCH * Math.max(1, days.length-1) + 10;
  var gridSize = Math.min(150, Math.max(44, sceneWidth + 24));
  var grid = new THREE.GridHelper(gridSize, Math.round(gridSize/4), 0x2a2e37, 0x1c1f26);
  scene.add(grid);

  var grayMin = new THREE.Color(0x1c1f26), grayMax = new THREE.Color(0x7b8394);
  var barHeights = [];
  var dayGroup = new THREE.Group();
  byDay.forEach(function(list, i){
    var h = 0.5 + list.length * 0.3;
    barHeights.push(h);
    var geo = new THREE.BoxGeometry(SLOT_W, h, 8);
    var t = list.length / maxDayCount;
    var col = grayMin.clone().lerp(grayMax, 0.15 + t*0.55);
    var mat = new THREE.MeshStandardMaterial({ color: col, roughness:0.95, metalness:0.02 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(dayX(i), h/2, 0);
    dayGroup.add(mesh);
  });
  scene.add(dayGroup);

  var positions = {}, nodeMeshes = [], edgeLines = [];
  var nodeGroup = new THREE.Group(), edgeGroup = new THREE.Group();
  var accentColor = new THREE.Color(ACCENT);

  byDay.forEach(function(list, i){
    var dMin = Math.min.apply(null, list.map(function(c){return c.t;}));
    var dMax = Math.max.apply(null, list.map(function(c){return c.t;}));
    list.forEach(function(c){
      var frac = dMax > dMin ? (c.t-dMin)/(dMax-dMin) : 0.5;
      var x = dayX(i) + (frac-0.5)*SLOT_W*0.72;
      var z = 0;
      var mag = Math.log2(1 + c.add + c.del);
      var y = barHeights[i] + 0.5 + Math.min(2.6, mag*0.3);
      var r = 0.13 + Math.min(0.22, mag*0.03);
      positions[c.sha] = new THREE.Vector3(x,y,z);
      var geo = new THREE.SphereGeometry(r, 14, 14);
      var mat = new THREE.MeshStandardMaterial({
        color: accentColor, emissive: accentColor, emissiveIntensity:0.42,
        roughness:0.35, metalness:0.15
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(positions[c.sha]);
      mesh.userData = { commit: c, baseEmissive:0.42 };
      nodeGroup.add(mesh); nodeMeshes.push(mesh);
    });
  });
  commits.forEach(function(c){
    var to = positions[c.sha];
    (c.parents||[]).forEach(function(p){
      var from = positions[p];
      if (!from) return;
      var mid = from.clone().lerp(to,0.5);
      mid.y += 0.5 + from.distanceTo(to)*0.05;
      var curve = new THREE.QuadraticBezierCurve3(from, mid, to);
      var geo = new THREE.BufferGeometry().setFromPoints(curve.getPoints(14));
      var mat = new THREE.LineBasicMaterial({ color: accentColor, transparent:true, opacity:0.5 });
      var line = new THREE.Line(geo, mat);
      edgeGroup.add(line); edgeLines.push(line);
    });
  });
  scene.add(nodeGroup); scene.add(edgeGroup);

  var target = new THREE.Vector3(0, Math.max(2, barHeights.reduce((a,b)=>a+b,0)/barHeights.length*0.6), 0);
  var defaultPhi = days.length > 6 ? 0.82 : 1.02;
  var camState = { theta: 0.65, phi: defaultPhi, radius: Math.min(78, Math.max(22, sceneWidth*0.58)), autoRotate: !reduceMotion };
  var MIN_R = 10, MAX_R = 80, MIN_PHI=0.32, MAX_PHI=1.48;

  function updateCamera(){
    var s = camState;
    camera.position.set(
      target.x + s.radius*Math.sin(s.phi)*Math.sin(s.theta),
      target.y + s.radius*Math.cos(s.phi),
      target.z + s.radius*Math.sin(s.phi)*Math.cos(s.theta)
    );
    camera.lookAt(target);
  }

  var dragging=false, lastX=0, lastY=0, moved=0, idleTimer=null;
  var pointers = {};
  var userAutoRotate = !reduceMotion;
  function wake(){
    if (idleTimer) clearTimeout(idleTimer);
    if (userAutoRotate && !reduceMotion) idleTimer = setTimeout(function(){ camState.autoRotate=true; }, 3800);
  }

  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    if (Object.keys(pointers).length===1){
      dragging=true; moved=0; lastX=e.clientX; lastY=e.clientY;
      canvas.classList.add('dragging');
      camState.autoRotate=false;
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if (pointers[e.pointerId]) pointers[e.pointerId] = {x:e.clientX,y:e.clientY};
    var ids = Object.keys(pointers);
    if (ids.length===2){
      var p = ids.map(function(id){return pointers[id];});
      var dist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if (canvas._pinch){
        camState.radius = Math.min(MAX_R, Math.max(MIN_R, camState.radius + (canvas._pinch-dist)*0.05));
      }
      canvas._pinch = dist; return;
    }
    if (!dragging){ handleHover(e); return; }
    var dx=e.clientX-lastX, dy=e.clientY-lastY;
    lastX=e.clientX; lastY=e.clientY; moved+=Math.abs(dx)+Math.abs(dy);
    camState.theta -= dx*0.0065;
    camState.phi = Math.min(MAX_PHI, Math.max(MIN_PHI, camState.phi - dy*0.0065));
    hideTooltip();
  });
  function endDrag(e){
    delete pointers[e.pointerId]; canvas._pinch=null;
    if (Object.keys(pointers).length===0){
      dragging=false; canvas.classList.remove('dragging');
      if (moved<5) handleClick(e);
      wake();
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    camState.radius = Math.min(MAX_R, Math.max(MIN_R, camState.radius + e.deltaY*0.02));
  }, { passive:false });

  var raycaster = new THREE.Raycaster();
  var mouseNdc = new THREE.Vector2();
  var tooltipEl = document.getElementById('tooltip');
  var hovered = null;

  function handleHover(e){
    var rect = canvas.getBoundingClientRect();
    mouseNdc.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouseNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouseNdc, camera);
    var hits = raycaster.intersectObjects(nodeMeshes);
    if (hits.length){
      var m = hits[0].object;
      if (hovered!==m){ if(hovered) setHover(hovered,false); hovered=m; setHover(m,true); }
      showTooltip(e.clientX-rect.left, e.clientY-rect.top, m.userData.commit);
      canvas.style.cursor='pointer';
    } else {
      if (hovered){ setHover(hovered,false); hovered=null; }
      hideTooltip();
      canvas.style.cursor = dragging?'grabbing':'grab';
    }
  }
  function setHover(m,on){
    m.material.emissiveIntensity = on?0.9:m.userData.baseEmissive;
    m.scale.setScalar(on?1.6:1);
  }
  function showTooltip(x,y,c){
    tooltipEl.hidden=false;
    tooltipEl.style.left=x+'px'; tooltipEl.style.top=y+'px';
    tooltipEl.innerHTML = '<div class="msg">'+escapeHtml(c.msg)+'</div><div class="meta">'+fmtDate(c.t)+'</div>';
  }
  function hideTooltip(){ tooltipEl.hidden=true; }
  function handleClick(e){
    var rect = canvas.getBoundingClientRect();
    mouseNdc.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouseNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouseNdc, camera);
    var hits = raycaster.intersectObjects(nodeMeshes);
    if (!hits.length) return;
    var c = hits[0].object.userData.commit;
    window.open('https://github.com/'+DATA.repo+'/commit/'+c.sha, '_blank', 'noopener');
  }
  function fmtDate(t){
    var d = new Date(t);
    return d.toLocaleDateString('fr-FR',{day:'2-digit',month:'short'})+' \u00b7 '+d.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'});
  }
  function escapeHtml(s){
    return s.replace(/[&<>"]/g, function(ch){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch]; });
  }

  function resize(){
    var w = stage.clientWidth, h = stage.clientHeight;
    renderer.setSize(w, h, false);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  var clock = new THREE.Clock();
  function tick(){
    var dt = clock.getDelta();
    if (camState.autoRotate) camState.theta += dt*0.06;
    updateCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
