name: Contribution Board (canon + marée)

on:
  schedule:
    - cron: "0 3 * * *"   # tous les jours à 3h
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cannon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Générer le canon
        uses: zaderlyl/contribution-board@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          style: cannon
          output: assets/commit-cannon.svg

      - name: Générer la marée
        uses: zaderlyl/contribution-board@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          username: ${{ github.repository_owner }}
          style: tide
          output: assets/commit-tide.svg

      - name: Commit si un SVG a changé
        run: |
          if [[ -n "$(git status --porcelain assets/commit-cannon.svg assets/commit-tide.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add assets/commit-cannon.svg assets/commit-tide.svg
            git commit -m "chore: mise à jour du contribution board"
            git pull --rebase origin main
            git push
          else
            echo "Rien à mettre à jour."
          fi
