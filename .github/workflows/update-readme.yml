name: Update README

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures
  workflow_dispatch:          # bouton "Run workflow" manuel (mise à jour immédiate)
  push:
    branches: [main]
    paths:
      - projects.config.json
      - scripts/update-projects.mjs
      - scripts/update-stats.mjs
      - scripts/svg-theme.mjs
      - .github/workflows/update-readme.yml

permissions:
  contents: write

# Une seule exécution à la fois : deux runs qui poussent en même temps
# se font rejeter l'un l'autre (non-fast-forward). Ici ils font la queue.
concurrency:
  group: update-readme
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Régénérer le tableau des projets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-projects.mjs

      - name: Régénérer les stats (contributions, streaks, langages)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Si ce token par défaut n'a pas accès au calendrier de contributions,
          # crée un token personnel (scope "read:user") et ajoute-le comme
          # secret du repo sous le nom STATS_TOKEN.
          STATS_TOKEN: ${{ secrets.STATS_TOKEN }}
        run: node scripts/update-stats.mjs

      - name: Commit si quelque chose a changé
        run: |
          if [[ -n "$(git status --porcelain README.md assets/stats.svg assets/projects.svg)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md assets/stats.svg assets/projects.svg
            git commit -m "chore: mise à jour auto (projets + stats)"
            git pull --rebase origin main
            git push
          else
            echo "Rien à mettre à jour."
          fi
