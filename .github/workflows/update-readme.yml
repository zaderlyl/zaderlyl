name: Update README projects

on:
  schedule:
    - cron: "0 */6 * * *"   # toutes les 6 heures
  workflow_dispatch:          # bouton "Run workflow" manuel (mise à jour immédiate)
  push:
    branches: [main]
    paths:
      - projects.config.json
      - scripts/update-projects.mjs
      - .github/workflows/update-readme.yml

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Régénérer le tableau des projets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node scripts/update-projects.mjs

      - name: Commit si le README a changé
        run: |
          if [[ -n "$(git status --porcelain README.md)" ]]; then
            git config user.name  "github-actions[bot]"
            git config user.email "github-actions[bot]@users.noreply.github.com"
            git add README.md
            git commit -m "chore: mise à jour auto du tableau des projets"
            git push
          else
            echo "README inchangé."
          fi
