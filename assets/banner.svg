<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 260" width="860" height="260" role="img" aria-label="Lilian Cornet, etudiant MMI, developpeur web et game design, en recherche d'alternance">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14101f"/>
      <stop offset="0.5" stop-color="#0d0b14"/>
      <stop offset="1" stop-color="#0a0b0d"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="round"><rect x="0" y="0" width="860" height="260" rx="14"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="860" height="260" fill="url(#bg)"/>

    <!-- titlebar -->
    <rect x="0" y="0" width="860" height="34" fill="#181322"/>
    <line x1="0" y1="34" x2="860" y2="34" stroke="#2c2440" stroke-width="1"/>
    <circle cx="22" cy="17" r="5.5" fill="#ff6b6b"/>
    <circle cx="41" cy="17" r="5.5" fill="#ffd43b"/>
    <circle cx="60" cy="17" r="5.5" fill="#69db7c"/>
    <text x="430" y="21.5" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="12" fill="#a99fc2">zaderlyl@github — zsh</text>

    <!-- liseré arc-en-ciel : la couleur qui manquait à sans-couleurs -->
    <g>
      <rect x="0"  y="34" width="107.5" height="5" fill="#ff6b6b"/>
      <rect x="107.5" y="34" width="107.5" height="5" fill="#ffa94d"/>
      <rect x="215" y="34" width="107.5" height="5" fill="#ffd43b"/>
      <rect x="322.5" y="34" width="107.5" height="5" fill="#69db7c"/>
      <rect x="430" y="34" width="107.5" height="5" fill="#3bc9db"/>
      <rect x="537.5" y="34" width="107.5" height="5" fill="#4dabf7"/>
      <rect x="645" y="34" width="107.5" height="5" fill="#9775fa"/>
      <rect x="752.5" y="34" width="107.5" height="5" fill="#f06595"/>
    </g>

    <!-- body -->
    <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="19">

      <text x="26" y="86" filter="url(#glow)">
        <tspan fill="#4dabf7" font-weight="700">lilian</tspan><tspan fill="#a99fc2">@</tspan><tspan fill="#f06595" font-weight="700">zaderlyl</tspan><tspan fill="#eef0f4">:~$ whoami</tspan>
        <animate attributeName="opacity" from="0" to="1" begin="0.1s" dur="0.01s" fill="freeze"/>
      </text>

      <text x="26" y="122" fill="#eef0f4" opacity="0">
        <tspan fill="#69db7c" font-weight="700">›</tspan> Cornet Lilian — MMI, IUT de Béziers
        <animate attributeName="opacity" from="0" to="1" begin="0.9s" dur="0.01s" fill="freeze"/>
      </text>

      <text x="26" y="152" fill="#eef0f4" opacity="0">
        <tspan fill="#ffd43b" font-weight="700">›</tspan> dev web <tspan fill="#a99fc2">·</tspan> systèmes bas niveau <tspan fill="#a99fc2">·</tspan> game design
        <animate attributeName="opacity" from="0" to="1" begin="1.5s" dur="0.01s" fill="freeze"/>
      </text>

      <text x="26" y="182" fill="#c9c2d9" opacity="0" font-size="17">
        <tspan fill="#9775fa" font-weight="700">›</tspan> boot: Nothing-OS <tspan fill="#a99fc2">·</tspan> load: sans-couleurs <tspan fill="#a99fc2">·</tspan> sync: Note-2-
        <animate attributeName="opacity" from="0" to="1" begin="2.1s" dur="0.01s" fill="freeze"/>
      </text>

      <text x="26" y="216" fill="#eef0f4" opacity="0" font-size="19">
        <tspan fill="#4dabf7" font-weight="700">›</tspan> status: <tspan fill="#ffa94d" font-weight="700" filter="url(#glow)">en recherche d'alternance</tspan><tspan fill="#eef0f4" dx="6">▌<animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;0.5;0.501;0.99;1" begin="2.9s" dur="1s" repeatCount="indefinite"/></tspan>
        <animate attributeName="opacity" from="0" to="1" begin="2.8s" dur="0.01s" fill="freeze"/>
      </text>
    </g>
  </g>
  <rect x="0.5" y="0.5" width="859" height="259" rx="14" fill="none" stroke="#2c2440"/>
</svg>
