<meta charset="utf-8">
<title>Retour en couleur</title>
<meta name="description" content="Historique git de sans-couleurs en 3D">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700;800&family=Manrope:wght@400;500;600;700;800&display=swap">
<style>
  :root{
    --void:#0a0b0d;
    --surface:#14161bf2;
    --surface-2:#1c1f26cc;
    --line:#2a2e37;
    --fog:#7b8394;
    --paper:#eef0f4;
    --paper-dim:#aeb3bf;
    --blue:#3987e5;
    --orange:#d95926;
    --aqua:#199e70;
    --radius:10px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--void);
    color:var(--paper);
    font-family:'Manrope',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
    overflow:hidden;
  }
  #app{position:fixed;inset:0;background:var(--void);}
  canvas#gl{position:absolute;inset:0;display:block;touch-action:none;cursor:grab;}
  canvas#gl.dragging{cursor:grabbing;}

  .hud{position:absolute;pointer-events:none;}
  .glass{
    background:var(--surface);
    backdrop-filter:blur(10px);
    border:1px solid var(--line);
    border-radius:var(--radius);
  }

  header.hud-top{
    top:0;left:0;right:0;
    display:flex;justify-content:space-between;align-items:flex-start;
    flex-wrap:wrap;
    gap:10px 16px;
    padding:16px 18px;
  }
  .brand{pointer-events:auto;max-width:52ch;}
  .eyebrow{
    display:block;
    font-family:'JetBrains Mono',monospace;
    font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
    color:var(--fog);margin-bottom:5px;
  }
  h1{
    margin:0;
    font-family:'JetBrains Mono',monospace;
    font-weight:800;
    font-size:clamp(19px,3.2vw,30px);
    letter-spacing:-.01em;
    text-wrap:balance;
  }
  .sub{
    margin:6px 0 0;
    font-size:12.5px;
    line-height:1.45;
    color:var(--paper-dim);
    max-width:44ch;
  }

  .stats{
    pointer-events:auto;
    display:flex;flex-wrap:wrap;justify-content:flex-end;
    gap:6px;
    max-width:min(420px,100%);
  }
  .tile{
    flex:1 1 92px;
    padding:7px 10px;
    display:flex;flex-direction:column;gap:1px;
  }
  .tile .n{
    font-family:'JetBrains Mono',monospace;
    font-variant-numeric:tabular-nums;
    font-size:16px;font-weight:700;
    line-height:1.15;
    white-space:nowrap;
  }
  .tile .l{
    font-size:9.5px;letter-spacing:.05em;text-transform:uppercase;
    color:var(--fog);
    white-space:nowrap;
  }
  .tile.add .n{color:var(--aqua);}
  .tile.del .n{color:var(--orange);}

  aside.legend{
    left:22px;bottom:22px;
    pointer-events:auto;
    padding:12px;
    display:flex;flex-direction:column;gap:6px;
    max-width:280px;
  }
  .legend-title{
    font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    color:var(--fog);margin:0 0 4px 2px;
  }
  .chip{
    display:flex;align-items:center;gap:8px;
    background:transparent;border:1px solid transparent;
    border-radius:7px;padding:6px 8px;
    font-size:12.5px;color:var(--paper);
    cursor:pointer;text-align:left;
    font-family:inherit;
    transition:background .15s ease, border-color .15s ease, opacity .15s ease;
  }
  .chip:hover{background:var(--surface-2);}
  .chip.active{border-color:var(--line);background:var(--surface-2);}
  .chip.dim{opacity:.4;}
  .chip .dot{width:9px;height:9px;border-radius:50%;flex:none;}
  .chip .name{flex:1;font-weight:600;}
  .chip .count{
    font-family:'JetBrains Mono',monospace;
    color:var(--paper-dim);font-size:11.5px;
  }

  .controls-hint{
    right:22px;bottom:22px;
    pointer-events:none;
    display:flex;gap:14px;
    font-size:11px;color:var(--paper-dim);
    padding:8px 12px;
  }
  .controls-hint span{white-space:nowrap;}
  .controls-hint kbd{
    font-family:'JetBrains Mono',monospace;
    color:var(--paper);
  }

  .zoom-btns{
    right:22px;top:50%;transform:translateY(-50%);
    pointer-events:auto;
    display:flex;flex-direction:column;gap:6px;
  }
  .zoom-btns button{
    width:34px;height:34px;
    background:var(--surface);border:1px solid var(--line);
    color:var(--paper);border-radius:8px;
    font-size:16px;cursor:pointer;line-height:1;
    display:flex;align-items:center;justify-content:center;
    font-family:'JetBrains Mono',monospace;
    transition:background .15s ease,border-color .15s ease;
  }
  .zoom-btns button:hover{background:var(--surface-2);border-color:var(--fog);}
  .zoom-btns button[aria-pressed="true"]{color:var(--aqua);border-color:var(--aqua);}
  .zoom-btns button:focus-visible, .chip:focus-visible, .detail-close:focus-visible, .detail a:focus-visible {
    outline:2px solid var(--aqua);outline-offset:2px;
  }

  .tooltip{
    position:absolute;pointer-events:none;
    transform:translate(-50%,calc(-100% - 14px));
    background:var(--surface);border:1px solid var(--line);
    border-radius:8px;padding:8px 10px;
    font-size:12px;max-width:240px;
    box-shadow:0 8px 24px rgba(0,0,0,.4);
  }
  .tooltip .msg{color:var(--paper);font-weight:600;margin-bottom:2px;}
  .tooltip .meta{color:var(--paper-dim);font-family:'JetBrains Mono',monospace;font-size:11px;}

  .detail{
    position:absolute;left:50%;bottom:22px;
    transform:translate(-50%,calc(100% + 30px));
    transition:transform .28s cubic-bezier(.2,.8,.2,1);
    pointer-events:auto;
    width:min(480px,88vw);
    padding:18px 20px;
  }
  .detail.open{transform:translate(-50%,0);}
  .detail-close{
    position:absolute;top:10px;right:12px;
    background:none;border:none;color:var(--paper-dim);
    font-size:18px;cursor:pointer;line-height:1;padding:4px;
  }
  .detail-close:hover{color:var(--paper);}
  .detail-branch{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'JetBrains Mono',monospace;font-size:11px;
    letter-spacing:.04em;color:var(--paper-dim);margin-bottom:8px;
  }
  .detail-branch .dot{width:8px;height:8px;border-radius:50%;}
  .detail h2{
    margin:0 0 12px;font-size:16px;font-weight:700;line-height:1.4;
    font-family:'Manrope',sans-serif;text-wrap:balance;
  }
  .detail dl{
    display:grid;grid-template-columns:auto 1fr;gap:6px 14px;
    margin:0 0 14px;font-size:12.5px;
  }
  .detail dt{color:var(--fog);}
  .detail dd{margin:0;color:var(--paper);font-family:'JetBrains Mono',monospace;font-size:12px;}
  .detail a{
    display:inline-block;color:var(--void);background:var(--paper);
    text-decoration:none;font-size:12.5px;font-weight:700;
    padding:8px 14px;border-radius:7px;
    transition:opacity .15s ease;
  }
  .detail a:hover{opacity:.85;}

  footer.credit{
    left:50%;top:22px;transform:translateX(-50%);
    pointer-events:none;
    font-size:11px;color:var(--fog);
    font-family:'JetBrains Mono',monospace;
    display:none;
  }

  @media (max-width:720px){
    header.hud-top{flex-direction:column;padding:14px;}
    .stats{max-width:100%;justify-content:flex-start;}
    aside.legend{max-width:64vw;}
    .controls-hint{display:none;}
    .zoom-btns{right:14px;}
  }
  @media (max-height:740px){
    .sub{display:none;}
    header.hud-top{padding:12px 16px;}
    h1{font-size:18px;}
    .eyebrow{margin-bottom:3px;}
    .tile{padding:5px 9px;}
    .tile .n{font-size:14px;}
    aside.legend{padding:9px;gap:3px;}
    .legend-title{margin-bottom:2px;}
    .chip{padding:4px 7px;font-size:11.5px;}
  }
  @media (max-height:560px){
    .stats{display:none;}
  }

  @media (prefers-reduced-motion:reduce){
    .detail{transition:none;}
  }
</style>

<div id="app">
  <canvas id="gl"></canvas>

  <header class="hud hud-top">
    <div class="brand">
      <span class="eyebrow">sans-couleurs · historique git</span>
      <h1>Retour en couleur</h1>
      <p class="sub">41 commits sur 4 nuits, du 8 au 11 septembre 2026 — chaque point est un commit réel, ouvre-le pour lire son message.</p>
    </div>
    <div class="stats" id="stats"></div>
  </header>

  <aside class="hud legend glass" id="legend">
    <p class="legend-title">Branches</p>
  </aside>

  <div class="hud controls-hint">
    <span><kbd>glisser</kbd> pivoter</span>
    <span><kbd>molette</kbd> zoomer</span>
    <span><kbd>clic</kbd> détail du commit</span>
  </div>

  <div class="hud zoom-btns">
    <button id="zoomIn" aria-label="Zoomer" title="Zoomer">+</button>
    <button id="zoomOut" aria-label="Dézoomer" title="Dézoomer">−</button>
    <button id="autoBtn" aria-label="Rotation automatique" title="Rotation automatique" aria-pressed="true">⟳</button>
  </div>

  <div class="tooltip glass" id="tooltip" hidden></div>

  <section class="detail glass" id="detail">
    <button class="detail-close" id="detailClose" aria-label="Fermer le détail">×</button>
    <div class="detail-branch"><span class="dot" id="detailDot"></span><span id="detailBranch"></span></div>
    <h2 id="detailMsg"></h2>
    <dl>
      <dt>Date</dt><dd id="detailDate"></dd>
      <dt>Lignes</dt><dd id="detailLines"></dd>
      <dt>SHA</dt><dd id="detailSha"></dd>
    </dl>
    <a id="detailLink" href="#" target="_blank" rel="noopener">Voir le commit sur GitHub ↗</a>
  </section>
</div>

  scene.fog = new THREE.FogExp2(VOID, 0.016);

  var camera = new THREE.PerspectiveCamera(45, 1, 0.1, 400);

  var hemi = new THREE.HemisphereLight(0x3a4258, 0x08090b, 0.75);
  scene.add(hemi);
  var dir = new THREE.DirectionalLight(0xeef0f4, 0.95);
  dir.position.set(18, 26, 14);
  scene.add(dir);
  var amb = new THREE.AmbientLight(0x8891a3, 0.25);
  scene.add(amb);

  // ground grid
  var grid = new THREE.GridHelper(120, 40, 0x2a2e37, 0x1c1f26);
  grid.position.y = 0;
  scene.add(grid);

  // ---------- layout ----------
  var PITCH = 15, SLOT_W = 10.5;
  var branchZ = {};
  branchNames.forEach(function(name, i){
    branchZ[name] = (i - (branchNames.length-1)/2) * 3.4;
  });

  function dayX(i){ return (i - (days.length-1)/2) * PITCH; }

  var grayMin = new THREE.Color(0x1c1f26), grayMax = new THREE.Color(0x7b8394);
  var barHeights = [];
  var dayGroup = new THREE.Group();
  byDay.forEach(function(list, i){
    var h = 0.5 + list.length * 0.34;
    barHeights.push(h);
    var w = SLOT_W, depth = (branchNames.length) * 3.4 + 3;
    var geo = new THREE.BoxGeometry(w, h, depth);
    var t = list.length / maxDayCount;
    var col = grayMin.clone().lerp(grayMax, 0.15 + t*0.55);
    var mat = new THREE.MeshStandardMaterial({ color: col, roughness:0.95, metalness:0.02 });
    var mesh = new THREE.Mesh(geo, mat);
    mesh.position.set(dayX(i), h/2, 0);
    dayGroup.add(mesh);

    // day label sprite (simple plane w/ canvas texture)
    var lbl = makeLabel(list[0].day.slice(8,10)+'/'+list[0].day.slice(5,7));
    lbl.position.set(dayX(i), h + 1.1, depth/2 + 0.2);
    dayGroup.add(lbl);
  });
  scene.add(dayGroup);

  function makeLabel(text){
    var c = document.createElement('canvas');
    c.width = 128; c.height = 64;
    var ctx = c.getContext('2d');
    ctx.fillStyle = 'rgba(0,0,0,0)';
    ctx.fillRect(0,0,c.width,c.height);
    ctx.font = '700 34px "JetBrains Mono", monospace';
    ctx.fillStyle = '#aeb3bf';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText(text, c.width/2, c.height/2);
    var tex = new THREE.CanvasTexture(c);
    tex.minFilter = THREE.LinearFilter;
    var mat = new THREE.SpriteMaterial({ map: tex, transparent:true, depthWrite:false });
    var sprite = new THREE.Sprite(mat);
    sprite.scale.set(3.2, 1.6, 1);
    return sprite;
  }

  // ---------- commit nodes ----------
  var positions = {};
  var nodeMeshes = [];
  var edgeLines = [];
  var nodeGroup = new THREE.Group();
  var edgeGroup = new THREE.Group();

  var timeMin = commits[0].t, timeMax = commits[commits.length-1].t;

  byDay.forEach(function(list, i){
    var dMin = Math.min.apply(null, list.map(function(c){return c.t;}));
    var dMax = Math.max.apply(null, list.map(function(c){return c.t;}));
    list.forEach(function(c){
      var frac = dMax > dMin ? (c.t - dMin)/(dMax - dMin) : 0.5;
      var x = dayX(i) + (frac - 0.5) * SLOT_W * 0.72;
      var z = branchZ[c.branch];
      var mag = Math.log2(1 + c.add + c.del);
      var y = barHeights[i] + 0.55 + Math.min(3.0, mag * 0.33);
      var r = 0.14 + Math.min(0.24, mag*0.032);
      positions[c.sha] = new THREE.Vector3(x, y, z);

      var color = new THREE.Color(DATA.branchColor[c.branch]);
      var geo = new THREE.SphereGeometry(r, 16, 16);
      var mat = new THREE.MeshStandardMaterial({
        color: color, emissive: color, emissiveIntensity:0.42,
        roughness:0.35, metalness:0.15, transparent:true, opacity:1
      });
      var mesh = new THREE.Mesh(geo, mat);
      mesh.position.copy(positions[c.sha]);
      mesh.userData = { commit: c, baseScale:1, baseEmissive:0.42 };
      nodeGroup.add(mesh);
      nodeMeshes.push(mesh);
    });
  });

  // edges (parent -> child), drawn after all positions known
  commits.forEach(function(c){
    var to = positions[c.sha];
    (c.parents||[]).forEach(function(p){
      var from = positions[p];
      if (!from) return;
      var mid = from.clone().lerp(to, 0.5);
      mid.y += 0.6 + from.distanceTo(to)*0.05;
      var curve = new THREE.QuadraticBezierCurve3(from, mid, to);
      var pts = curve.getPoints(16);
      var geo = new THREE.BufferGeometry().setFromPoints(pts);
      var color = new THREE.Color(DATA.branchColor[c.branch]);
      var mat = new THREE.LineBasicMaterial({ color: color, transparent:true, opacity:0.55 });
      var line = new THREE.Line(geo, mat);
      line.userData = { branch: c.branch };
      edgeGroup.add(line);
      edgeLines.push(line);
    });
  });

  scene.add(nodeGroup);
  scene.add(edgeGroup);

  // ---------- camera orbit (custom, no external controls lib) ----------
  var target = new THREE.Vector3(0, 3, 0);
  var camState = { theta: 0.7, phi: 1.05, radius: 42, autoRotate: !reduceMotion };
  var MIN_R = 14, MAX_R = 95, MIN_PHI = 0.32, MAX_PHI = 1.48;

  function updateCamera(){
    var s = camState;
    camera.position.set(
      target.x + s.radius * Math.sin(s.phi) * Math.sin(s.theta),
      target.y + s.radius * Math.cos(s.phi),
      target.z + s.radius * Math.sin(s.phi) * Math.cos(s.theta)
    );
    camera.lookAt(target);
  }

  var dragging = false, lastX=0, lastY=0, moved=0, idleTimer=null;
  var pointers = {};

  function wake(){
    if (idleTimer) clearTimeout(idleTimer);
    if (userAutoRotate && !reduceMotion){
      idleTimer = setTimeout(function(){ camState.autoRotate = true; }, 4200);
    }
  }
  var userAutoRotate = !reduceMotion;

  canvas.addEventListener('pointerdown', function(e){
    canvas.setPointerCapture(e.pointerId);
    pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
    if (Object.keys(pointers).length === 1){
      dragging = true; moved = 0;
      lastX = e.clientX; lastY = e.clientY;
      canvas.classList.add('dragging');
      camState.autoRotate = false;
    }
  });
  canvas.addEventListener('pointermove', function(e){
    if (pointers[e.pointerId]) pointers[e.pointerId] = {x:e.clientX, y:e.clientY};
    var ids = Object.keys(pointers);

    if (ids.length === 2){
      var p = ids.map(function(id){return pointers[id];});
      var dist = Math.hypot(p[0].x-p[1].x, p[0].y-p[1].y);
      if (canvas._pinchDist){
        var delta = canvas._pinchDist - dist;
        camState.radius = Math.min(MAX_R, Math.max(MIN_R, camState.radius + delta*0.06));
      }
      canvas._pinchDist = dist;
      return;
    }

    if (!dragging) { handleHover(e); return; }
    var dx = e.clientX - lastX, dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    moved += Math.abs(dx)+Math.abs(dy);
    camState.theta -= dx * 0.0062;
    camState.phi = Math.min(MAX_PHI, Math.max(MIN_PHI, camState.phi - dy * 0.0062));
    hideTooltip();
  });
  function endDrag(e){
    delete pointers[e.pointerId];
    canvas._pinchDist = null;
    if (Object.keys(pointers).length === 0){
      dragging = false;
      canvas.classList.remove('dragging');
      if (moved < 5) handleClick(e);
      wake();
    }
  }
  canvas.addEventListener('pointerup', endDrag);
  canvas.addEventListener('pointercancel', endDrag);
  canvas.addEventListener('wheel', function(e){
    e.preventDefault();
    camState.radius = Math.min(MAX_R, Math.max(MIN_R, camState.radius + e.deltaY*0.028));
  }, { passive:false });

  document.getElementById('zoomIn').addEventListener('click', function(){
    camState.radius = Math.max(MIN_R, camState.radius - 7);
  });
  document.getElementById('zoomOut').addEventListener('click', function(){
    camState.radius = Math.min(MAX_R, camState.radius + 7);
  });
  var autoBtn = document.getElementById('autoBtn');
  autoBtn.addEventListener('click', function(){
    userAutoRotate = !userAutoRotate;
    camState.autoRotate = userAutoRotate;
    autoBtn.setAttribute('aria-pressed', String(userAutoRotate));
  });
  if (reduceMotion){
    userAutoRotate = false;
    autoBtn.setAttribute('aria-pressed','false');
  }

  // ---------- hover / click ----------
  var raycaster = new THREE.Raycaster();
  var mouseNdc = new THREE.Vector2();
  var tooltipEl = document.getElementById('tooltip');
  var hovered = null;

  function handleHover(e){
    var rect = canvas.getBoundingClientRect();
    mouseNdc.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouseNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouseNdc, camera);
    var hits = raycaster.intersectObjects(nodeMeshes);
    if (hits.length){
      var m = hits[0].object;
      if (hovered !== m){
        if (hovered) setHoverState(hovered,false);
        hovered = m; setHoverState(m,true);
      }
      showTooltip(e.clientX, e.clientY, m.userData.commit);
      canvas.style.cursor = 'pointer';
    } else {
      if (hovered){ setHoverState(hovered,false); hovered=null; }
      hideTooltip();
      canvas.style.cursor = dragging ? 'grabbing' : 'grab';
    }
  }
  function setHoverState(m, on){
    m.material.emissiveIntensity = on ? 0.9 : m.userData.baseEmissive;
    var s = on ? 1.6 : 1;
    m.scale.setScalar(s);
  }
  function showTooltip(x,y,c){
    tooltipEl.hidden = false;
    tooltipEl.style.left = x+'px';
    tooltipEl.style.top = y+'px';
    tooltipEl.innerHTML = '<div class="msg">'+escapeHtml(c.msg)+'</div>'+
      '<div class="meta">'+fmtDate(c.t)+' · '+c.branch+'</div>';
  }
  function hideTooltip(){ tooltipEl.hidden = true; }

  var detailEl = document.getElementById('detail');
  function handleClick(e){
    var rect = canvas.getBoundingClientRect();
    mouseNdc.x = ((e.clientX-rect.left)/rect.width)*2-1;
    mouseNdc.y = -((e.clientY-rect.top)/rect.height)*2+1;
    raycaster.setFromCamera(mouseNdc, camera);
    var hits = raycaster.intersectObjects(nodeMeshes);
    if (!hits.length) return;
    var c = hits[0].object.userData.commit;
    document.getElementById('detailDot').style.background = DATA.branchColor[c.branch];
    document.getElementById('detailBranch').textContent = c.branch;
    document.getElementById('detailMsg').textContent = c.msg;
    document.getElementById('detailDate').textContent = fmtDate(c.t);
    document.getElementById('detailLines').textContent = '+'+c.add+' / −'+c.del;
    document.getElementById('detailSha').textContent = c.sha;
    document.getElementById('detailLink').href = 'https://github.com/'+DATA.repo+'/commit/'+c.sha;
    detailEl.classList.add('open');
  }
  document.getElementById('detailClose').addEventListener('click', function(){
    detailEl.classList.remove('open');
  });

  function fmtDate(t){
    var d = new Date(t);
    return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'short' }) + ' · ' +
      d.toLocaleTimeString('fr-FR', { hour:'2-digit', minute:'2-digit' });
  }
  function escapeHtml(s){
    return s.replace(/[&<>"]/g, function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[ch];
    });
  }

  // ---------- resize ----------
  function resize(){
    var w = window.innerWidth, h = window.innerHeight;
    renderer.setSize(w, h);
    camera.aspect = w/h;
    camera.updateProjectionMatrix();
  }
  window.addEventListener('resize', resize);
  resize();

  // ---------- render loop ----------
  var clock = new THREE.Clock();
  function tick(){
    var dt = clock.getDelta();
    if (camState.autoRotate) camState.theta += dt * 0.055;
    updateCamera();
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();
})();
</script>
